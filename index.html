function evalMath(input){
 const s=input.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/%/g,'/100');
 let i=0;function ws(){while(s[i]===' ')i++}
 function expr(){let v=term();while(true){ws();if(s[i]==='+'){i++;v+=term()}else if(s[i]==='-'){i++;v-=term()}else return v}}
 function term(){let v=factor();while(true){ws();if(s[i]==='*'){i++;v*=factor()}else if(s[i]==='/'){i++;const d=factor();if(!d)throw Error();v/=d}else return v}}
 function factor(){ws();if(s[i]==='+'){i++;return factor()}if(s[i]==='-'){i++;return -factor()}if(s[i]==='('){i++;const v=expr();ws();if(s[i++]!==')')throw Error();return v}let start=i;while(/[0-9.]/.test(s[i]||'')&&i<s.length)i++;if(start===i)throw Error();const n=Number(s.slice(start,i));if(!Number.isFinite(n))throw Error();return n}
 const v=expr();ws();if(i!==s.length||!Number.isFinite(v))throw Error();return v;
}

 else if(app==='settings') html='<div class="app-tile"><h3>هاتف صخب</h3><p>إعدادات المحاكي</p><div class="setting-row">الوضع الداكن <button class="switch on" id="darkSwitch"></button></div><div class="setting-row">خلفية زرقاء <button class="switch on" id="wallSwitch"></button></div><div class="setting-row">اسم الجهاز <b>iPhone — S5B</b></div><div class="setting-row">إصدار الواجهة <b>iOS-style Web 1.0</b></div></div><div class="app-tile"><p>هذه الإعدادات تغيّر شكل المحاكي فقط ولا تغيّر إعدادات هاتفك الحقيقي.</p></div>';
 else if(app==='clock') html='<div class="app-tile"><div class="clock-big" id="clockApp">00:00:00</div><div class="clock-date" id="clockAppDate"></div><div style="display:flex;justify-content:center;gap:9px"><button class="primary" id="stopStart">ابدأ المؤقت</button><button class="secondary" id="stopReset">إعادة</button></div><p style="text-align:center;margin-top:15px">ساعة المحاكي ومؤقّت إيقاف حقيقي داخل الصفحة</p></div>';
 else if(app==='calendar'){const d=new Date(),first=new Date(d.getFullYear(),d.getMonth(),1).getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();html='<div class="app-tile"><h3 style="text-align:center">'+d.toLocaleDateString('ar',{month:'long',year:'numeric'})+'</h3><div class="calendar-grid">'+['أح','إث','ثل','أر','خم','جم','سب'].map(x=>'<span style="color:#81899a;font-weight:800">'+x+'</span>').join('')+Array(first).fill('<span></span>').join('')+Array.from({length:days},(_,i)=>'<span class="'+(i+1===d.getDate()?'today':'')+'">'+(i+1)+'</span>').join('')+'</div></div><div class="app-tile"><h3>لا توجد أحداث</h3><p>هذا تقويم محلي للعرض. إضافة ومزامنة الأحداث غير متصلة بحساب تقويم خارجي.</p></div>'}
 else if(app==='notes') html='<div class="app-tile"><h3>ملاحظاتي</h3><textarea class="notes-area" id="notesArea" placeholder="اكتب ملاحظاتك هنا..."></textarea><p id="noteStatus">تُحفظ الملاحظات على هذا المتصفح تلقائياً.</p></div>';
 else if(app==='phone') html='<div class="app-tile"><div class="phone-number" id="phoneNumber"></div><div class="phone-keypad">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(x=>'<button data-digit="'+x+'">'+x+'</button>').join('')+'</div><div style="text-align:center"><button class="primary" id="callBtn" style="background:#20bd68;border-radius:30px">☎ اتصال تجريبي</button> <button class="secondary" id="clearNumber">مسح</button></div><p style="text-align:center">المكالمات الحقيقية غير متاحة من موقع ويب.</p></div>';
 else if(app==='camera') html='<div class="app-tile"><h3>الكاميرا</h3><div class="camera-box" id="cameraBox">اضغط تشغيل للسماح بالكاميرا</div><button class="primary" id="startCamera" style="margin-top:12px">تشغيل الكاميرا</button><p>يتطلب إذن الكاميرا من المتصفح واتصالاً آمناً.</p></div>';
 else if(app==='photos') html='<div class="app-tile"><h3>معرض صخب</h3><p>صور ومقاطع عامة من حساباته.</p><div class="gallery"><a class="photo" href="https://x.com/S5B_Q" target="_blank"><img src="https://pbs.twimg.com/media/G-fvW_0WAAAaP-7.jpg"><span>من حساب X</span></a><a class="photo" href="https://www.youtube.com/@s5b1" target="_blank"><img src="https://img.youtube.com/vi/fjhfp0G27XI/hqdefault.jpg"><span>من يوتيوب</span></a><a class="photo" href="https://www.youtube.com/@s5b1" target="_blank"><img src="https://img.youtube.com/vi/rdGL1LNWr_0/hqdefault.jpg"><span>مقطع S5B</span></a><a class="photo" href="https://kick.com/s5b" target="_blank"><img src="'+logo+'"><span>قناة Kick</span></a></div><label class="primary" style="display:inline-block;margin-top:14px;cursor:pointer">إضافة صورة من جهازك <input id="photoUpload" type="file" accept="image/*" hidden></label><div id="localPhotos" class="gallery" style="margin-top:10px"></div></div>';
 else if(app==='about') html='<div class="profile-card"><img src="'+logo+'"><div><h2>صخب · S5B</h2><p>ستريمر وصانع محتوى</p></div></div>';
 content.innerHTML=shell(html);view.classList.add('open');wireApp(app);
}
function wireApp(app){
 if(app==='calculator'){
  let expr='',display='0';const result=document.getElementById('calcResult'),line=document.getElementById('calcExpr');
  function render(){line.textContent=expr;result.textContent=display}
  document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.key;if(k==='AC'){expr='';display='0'}else if(k==='±'){if(display!=='0')display=String(-Number(display));expr=display}else if(k==='='){try{display=String(Number(evalMath(expr||display).toPrecision(11)));expr=display}catch{display='خطأ'}}else{if(display==='خطأ')display='0';if(['+','−','×','÷'].includes(k)){expr+=k;display=k}else if(k==='%'){expr+='%';display='%'}else{expr+=k;display=expr.slice(-12)}}render()}));render();
 }
 if(app==='safari'){document.getElementById('goWeb').onclick=()=>{let u=document.getElementById('webAddress').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener')};document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>window.open(links[b.dataset.site],'_blank','noopener'))}
 if(app==='settings'){document.getElementById('darkSwitch').onclick=e=>e.currentTarget.classList.toggle('on');document.getElementById('wallSwitch').onclick=e=>{e.currentTarget.classList.toggle('on');document.querySelector('.wallpaper').style.background=e.currentTarget.classList.contains('on')?'radial-gradient(circle at 50% 35%,#163a66,#0b1730 45%,#080c17)':'radial-gradient(circle at 50% 35%,#35502d,#1d2a1b 45%,#0b100b)'}}
 if(app==='clock'){let seconds=0,run=false,timer=null;const draw=()=>{document.getElementById('clockApp').textContent=new Date().toLocaleTimeString('en-GB');document.getElementById('clockAppDate').textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})};draw();let clockInterval=setInterval(()=>{if(!document.getElementById('clockApp'))clearInterval(clockInterval);else draw()},1000);document.getElementById('stopStart').onclick=e=>{run=!run;e.currentTarget.textContent=run?'إيقاف المؤقت':'استئناف المؤقت';if(run)timer=setInterval(()=>{seconds++;if(document.getElementById('clockApp'))document.getElementById('clockApp').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')},1000);else clearInterval(timer)};document.getElementById('stopReset').onclick=()=>{seconds=0;run=false;clearInterval(timer);document.getElementById('stopStart').textContent='ابدأ المؤقت';document.getElementById('clockApp').textContent='00:00'}}
 if(app==='notes'){const area=document.getElementById('notesArea');area.value=localStorage.getItem('s5b-notes')||'';area.addEventListener('input',()=>{localStorage.setItem('s5b-notes',area.value);document.getElementById('noteStatus').textContent='تم الحفظ تلقائياً ✓'})}
 if(app==='phone'){let n='';const out=document.getElementById('phoneNumber');document.querySelectorAll('[data-digit]').forEach(b=>b.onclick=()=>{n+=b.dataset.digit;out.textContent=n});document.getElementById('clearNumber').onclick=()=>{n='';out.textContent=''};document.getElementById('callBtn').onclick=()=>showToast('هذه مكالمة تجريبية فقط')}
 if(app==='camera'){document.getElementById('startCamera').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({video:true});const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.srcObject=stream;const box=document.getElementById('cameraBox');box.textContent='';box.appendChild(v);document.getElementById('startCamera').textContent='الكاميرا تعمل'}catch(e){showToast('تعذر فتح الكاميرا أو لم يتم منح الإذن')}}}
 if(app==='photos'){document.getElementById('photoUpload').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=document.createElement('img');img.src=URL.createObjectURL(f);img.style.cssText='width:100%;border-radius:12px';document.getElementById('localPhotos').appendChild(img)}}
}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
document.getElementById('back').addEventListener('click',()=>view.classList.remove('open'));
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});}
tick();setInterval(tick,30000);
</script>
