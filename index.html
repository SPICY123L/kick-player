<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>هاتف صخب | S5B</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#05070d;--panel:#111521;--muted:#9aa3b7;--line:#ffffff18;--blue:#168cff;--green:#24d17e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 15%,#18243d 0,#090d17 42%,#03050a 100%);color:#fff}body{min-height:100svh;display:grid;place-items:center;padding:22px 12px;overflow-x:hidden}
.stage{width:min(100%,430px);display:flex;flex-direction:column;align-items:center;gap:12px}.hint{font-size:12px;color:#9ca9c1;text-align:center}
.phone{width:min(100%,390px);height:min(820px,calc(100svh - 65px));min-height:620px;border:7px solid #252a35;border-radius:52px;background:#070a12;box-shadow:0 0 0 2px #626a78,0 28px 90px #000b,0 0 50px #167cff20;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;background:linear-gradient(160deg,#0c1830,#070b15 52%,#101827);overflow:hidden}
.wallpaper{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#163a66 0,#0b1730 35%,#080c17 72%);overflow:hidden}
.wallpaper:before,.wallpaper:after{content:"";position:absolute;border:1px solid #4ca6ff25;border-radius:50%;width:390px;height:390px;left:50%;top:48%;transform:translate(-50%,-50%);box-shadow:0 0 80px #168cff12,inset 0 0 60px #168cff10}
.wallpaper:after{width:280px;height:280px;border-color:#b3d9ff22}
.status{position:absolute;top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:12px;font-weight:800;z-index:5;direction:ltr}.status .right{display:flex;gap:6px;align-items:center}.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:105px;height:29px;border-radius:30px;background:#000;z-index:7;box-shadow:inset 0 0 0 1px #ffffff0b}
.lock{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;padding-top:100px;text-align:center;background:linear-gradient(#07101b55,#07101b22 48%,#02050b88);transition:opacity .35s,transform .35s}
.lock.hide{opacity:0;pointer-events:none;transform:translateY(-15px)}
.lock-logo{width:98px;height:98px;border-radius:29px;object-fit:cover;border:1px solid #ffffff30;box-shadow:0 15px 40px #0008}
.lock h1{font-size:23px;margin:14px 0 0;font-weight:900}.lock .sub{color:#c3d0e5;font-size:12px;margin-top:1px}.clock{font-size:68px;line-height:1.1;font-weight:500;letter-spacing:-3px;margin-top:32px;text-shadow:0 4px 25px #0008}.date{font-size:14px;color:#e0e8f7;margin-top:2px}
.unlock{margin-top:auto;margin-bottom:58px;display:flex;flex-direction:column;align-items:center;gap:9px;color:#eaf3ff;font-size:12px;cursor:pointer;user-select:none}.swipe{width:112px;height:5px;background:#ffffffd9;border-radius:9px;box-shadow:0 1px 8px #0008}
.home{position:absolute;inset:0;z-index:2;padding:68px 21px 36px;opacity:0;pointer-events:none;transform:scale(1.025);transition:.35s}.home.show{opacity:1;pointer-events:auto;transform:scale(1)}
.widget{border:1px solid #ffffff20;background:linear-gradient(135deg,#ffffff20,#ffffff09);backdrop-filter:blur(18px);border-radius:24px;padding:14px;display:flex;align-items:center;gap:13px;box-shadow:0 12px 32px #0003}
.widget img{width:58px;height:58px;border-radius:18px;object-fit:cover}.widget strong{font-size:15px}.widget p{margin:1px 0 0;color:#d0d9e9;font-size:11px}.verified{color:#62b7ff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;margin-top:27px}.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;color:#fff;border:0;padding:0;min-width:0;cursor:pointer;font:inherit}.app-icon{width:59px;height:59px;border-radius:18px;display:grid;place-items:center;font-size:27px;box-shadow:0 7px 15px #0005;border:1px solid #ffffff1c;position:relative;overflow:hidden}.app-icon img{width:100%;height:100%;object-fit:cover}.app span:last-child{font-size:10px;text-shadow:0 1px 4px #000;white-space:nowrap}.kick{background:linear-gradient(145deg,#31e58c,#087e49)}.youtube{background:#ff0033}.instagram{background:linear-gradient(145deg,#ffb14a,#e1306c 48%,#833ab4)}.xapp{background:#08090c}.photos{background:linear-gradient(145deg,#ff6b6b,#ffd15c,#6ad7ae,#58a8ff,#aa78ff)}
.dock{position:absolute;bottom:25px;left:18px;right:18px;height:83px;border-radius:27px;background:#ffffff24;border:1px solid #ffffff2b;backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:space-evenly}
.dock .app-icon{width:53px;height:53px;border-radius:16px}.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:112px;height:5px;background:#fff;border-radius:10px;z-index:9;cursor:pointer}
.appview{position:absolute;inset:0;z-index:8;background:#f5f6fa;color:#141821;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.appview.open{transform:translateY(0)}
.appbar{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 19px;background:#f5f6fa;border-bottom:1px solid #00000010}.appbar strong{font-size:15px}.back{border:0;background:#e7eaf0;color:#202735;border-radius:12px;padding:7px 12px;font:700 12px Cairo;cursor:pointer}
.appcontent{padding:17px;overflow:auto;flex:1}.profile-card{background:linear-gradient(135deg,#0b1425,#172d4b);color:#fff;border-radius:23px;padding:20px;display:flex;align-items:center;gap:14px}.profile-card img{width:74px;height:74px;border-radius:22px;object-fit:cover}.profile-card h2{font-size:18px;margin:0}.profile-card p{font-size:11px;color:#c4d2e6;margin:3px 0}
.links{display:grid;gap:10px;margin-top:18px}.link{background:white;border:1px solid #e6e8ee;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;text-decoration:none;color:#1a2230;font-size:13px;font-weight:800;box-shadow:0 4px 14px #18243a08}.link b{margin-right:auto;color:#8490a2;font-size:17px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photo{border:0;padding:0;border-radius:15px;overflow:hidden;background:#e2e5eb;aspect-ratio:1/1;cursor:pointer;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo span{position:absolute;bottom:0;left:0;right:0;padding:20px 9px 8px;color:white;font-size:10px;text-align:right;background:linear-gradient(transparent,#000b)}
.note{font-size:11px;color:#6c7585;margin:12px 2px}.live-card{border-radius:20px;background:#fff;padding:16px;box-shadow:0 5px 18px #18243a0c}.live-card h3{margin:0 0 5px;font-size:15px}.live-card p{margin:0;color:#697386;font-size:12px;line-height:1.8}.open-live{display:block;text-align:center;text-decoration:none;background:#16b86d;color:#fff;border-radius:14px;padding:12px;margin-top:13px;font-size:13px;font-weight:900}
.toast{position:absolute;z-index:12;bottom:100px;left:50%;transform:translateX(-50%);background:#111b2b;color:#fff;border:1px solid #ffffff24;border-radius:30px;padding:8px 14px;font-size:11px;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-height:700px){.phone{height:calc(100svh - 42px);min-height:0;border-radius:40px}.home{padding-top:58px}.grid{gap:14px 10px;margin-top:17px}.app-icon{width:52px;height:52px;border-radius:16px}.dock{height:70px;bottom:19px}.clock{font-size:58px;margin-top:20px}}
@media(min-width:700px){.phone{height:820px}}
</style>
</head>
<body>
<main class="stage">
<div class="phone" aria-label="محاكاة هاتف آيفون صخب">
<div class="screen">
<div class="wallpaper"></div>
<div class="status"><span>9:41</span><span class="right">▮▮▮　◉　▰</span></div><div class="island"></div>
<section class="lock" id="lock">
<img class="lock-logo" src="https://files.kick.com/images/user/5543715/profile_image/conversion/0f18fe5a-ccaf-4fc9-b6b4-fb6d953c7952-fullsize.webp" alt="شعار S5B">
<h1>هاتف صخب</h1><div class="sub">S5B · Creator Edition</div>
<div class="clock" id="clock">9:41</div><div class="date" id="date"></div>
<div class="unlock" id="unlock"><div>اضغط لفتح الآيفون</div><div class="swipe"></div></div>
</section>
<section class="home" id="home">
<div class="widget"><img src="https://files.kick.com/images/user/5543715/profile_image/conversion/0f18fe5a-ccaf-4fc9-b6b4-fb6d953c7952-fullsize.webp" alt="S5B"><div><strong>صخب <span class="verified">✓</span></strong><p>مرحباً بك في جوال S5B</p></div></div>
<div class="grid">
<button class="app" data-app="kick"><span class="app-icon kick">K</span><span>Kick</span></button>
<button class="app" data-app="youtube"><span class="app-icon youtube">▶</span><span>YouTube</span></button>
<button class="app" data-app="instagram"><span class="app-icon instagram">◎</span><span>Instagram</span></button>
<button class="app" data-app="x"><span class="app-icon xapp">𝕏</span><span>X</span></button>
<button class="app" data-app="photos"><span class="app-icon photos">🌈</span><span>الصور</span></button>
<button class="app" data-app="about"><span class="app-icon" style="background:linear-gradient(145deg,#293d5d,#101827)">ⓘ</span><span>عن صخب</span></button>
<button class="app" data-app="discord"><span class="app-icon" style="background:#5865f2">◉</span><span>Discord</span></button>
<button class="app" data-app="whatsapp"><span class="app-icon" style="background:#20c96b">◔</span><span>WhatsApp</span></button>
</div>
<div class="dock">
<button class="app" data-app="kick"><span class="app-icon kick">K</span></button>
<button class="app" data-app="youtube"><span class="app-icon youtube">▶</span></button>
<button class="app" data-app="instagram"><span class="app-icon instagram">◎</span></button>
<button class="app" data-app="x"><span class="app-icon xapp">𝕏</span></button>
</div>
</section>
<section class="appview" id="appview"><header class="appbar"><button class="back" id="back">رجوع</button><strong id="appTitle">التطبيق</strong><span style="width:48px"></span></header><div class="appcontent" id="appContent"></div></section>
<div class="toast" id="toast"></div>
<div class="home-indicator" id="homeIndicator"></div>
</div></div>
<div class="hint">تصميم تجريبي تفاعلي مستوحى من واجهة الآيفون — اضغط على الشاشة لفتحها ثم جرّب التطبيقات</div>
</main>
<script>
const links={kick:'https://kick.com/s5b',youtube:'https://www.youtube.com/@s5b1',instagram:'https://www.instagram.com/s5b_x/',x:'https://x.com/S5B_Q',discord:'https://discord.com/invite/rtrp',whatsapp:'https://whatsapp.com/channel/0029VacqnoE0rGiJ0w8MpO3k'};
const logo='https://files.kick.com/images/user/5543715/profile_image/conversion/0f18fe5a-ccaf-4fc9-b6b4-fb6d953c7952-fullsize.webp';
const videos=[
{title:'صورة احتفالية نشرها صخب على X',image:'https://pbs.twimg.com/media/G-fvW_0WAAAaP-7.jpg',url:'https://x.com/S5B_Q'},
{title:'صخب | S5B — من قناة يوتيوب',id:'fjhfp0G27XI'},
{title:'S5B 12',id:'rdGL1LNWr_0'},
{title:'لقطات ومحتوى صخب',id:'Fr-t0FqGkLg'},
{title:'مقاطع من قناة صخب',id:'',fallback:logo}
];
const lock=document.getElementById('lock'),home=document.getElementById('home'),view=document.getElementById('appview'),content=document.getElementById('appContent'),title=document.getElementById('appTitle'),toast=document.getElementById('toast');
function unlock(){lock.classList.add('hide');home.classList.add('show')}
document.getElementById('unlock').addEventListener('click',unlock);
document.getElementById('homeIndicator').addEventListener('click',()=>{view.classList.remove('open');lock.classList.add('hide');home.classList.add('show')});
function showToast(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)}
function openApp(app){
 let html='';
 const names={kick:'Kick',youtube:'YouTube',instagram:'Instagram',x:'X',photos:'الصور',about:'عن صخب',discord:'Discord',whatsapp:'WhatsApp'};
 title.textContent=names[app]||'التطبيق';
 if(app==='photos'){
  html='<div class="gallery">'+videos.map(v=>'<a class="photo" href="'+(v.url||(v.id?'https://www.youtube.com/watch?v='+v.id:'https://www.youtube.com/@s5b1'))+'" target="_blank" rel="noopener"><img loading="lazy" src="'+(v.image||(v.id?'https://img.youtube.com/vi/'+v.id+'/hqdefault.jpg':logo))+'" alt="'+v.title+'"><span>'+v.title+'</span></a>').join('')+'</div><p class="note">معرض لصور مصغّرة ولقطات من محتوى قناة صخب العلني. اضغط على أي صورة لفتح المقطع الأصلي.</p>';
 }else if(app==='about'){
  html='<div class="profile-card"><img src="'+logo+'" alt="شعار صخب"><div><h2>صخب · S5B</h2><p>ستريمر وصانع محتوى</p><p>قناته على Kick وYouTube</p></div></div><div class="live-card" style="margin-top:15px"><h3>مرحباً بك في هاتف صخب</h3><p>واجهة تجريبية لمحاكاة آيفون بطابع S5B. الحسابات المرتبطة هنا هي الروابط العامة المنشورة لصاحب القناة.</p></div>';
 }else{
  const desc={kick:'افتح قناة صخب على Kick لمشاهدة البثوث والمقاطع المتاحة.',youtube:'افتح قناة صخب الرسمية على YouTube لمشاهدة الفيديوهات.',instagram:'افتح حساب صخب على Instagram.',x:'تابع حساب صخب على منصة X.',discord:'رابط مجتمع صخب على Discord.',whatsapp:'قناة واتساب العامة المرتبطة بحساب صخب.'};
  html='<div class="profile-card"><img src="'+logo+'" alt="شعار صخب"><div><h2>صخب · S5B</h2><p>'+desc[app]+'</p></div></div><a class="open-live" href="'+links[app]+'" target="_blank" rel="noopener">فتح '+names[app]+' ↗</a>';
 }
 content.innerHTML=html;view.classList.add('open');
}
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
document.getElementById('back').addEventListener('click',()=>view.classList.remove('open'));
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('date').textContent=d.toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});}
tick();setInterval(tick,30000);
</script>
</body>
</html>
