<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kick Player</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#123b2b 0,#090d0b 45%,#050706 100%);color:#f5f7f6;font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(900px,100%)}header{text-align:center;margin-bottom:28px}.logo{font-size:42px;font-weight:900;letter-spacing:-2px}.logo span{color:#53e09a}.sub{color:#aab8b0;margin-top:8px}.panel{background:#101713;border:1px solid #26372e;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0008}.form{display:flex;gap:10px;margin-bottom:18px}input{flex:1;min-width:0;background:#080d0a;border:1px solid #35483d;border-radius:12px;padding:15px;color:white;font-size:16px;outline:none}input:focus{border-color:#53e09a}button{border:0;border-radius:12px;padding:0 24px;background:#53e09a;color:#07130c;font-weight:800;font-size:16px;cursor:pointer}button:hover{filter:brightness(1.08)}.screen{aspect-ratio:16/9;background:#050706;border:1px solid #26372e;border-radius:14px;overflow:hidden;display:grid;place-items:center}.screen iframe{width:100%;height:100%;border:0}.placeholder{text-align:center;color:#9eaaa3;padding:20px}.placeholder strong{display:block;color:#e9f2ec;font-size:20px;margin-bottom:8px}.note{color:#84948b;font-size:13px;line-height:1.8;margin:16px 4px 0}.status{color:#53e09a;font-size:13px;min-height:20px;margin:0 4px 10px}@media(max-width:560px){.form{flex-direction:column}button{padding:15px}.logo{font-size:36px}.panel{padding:14px}}
</style>
</head>
<body><main class="app"><header><div class="logo">KICK<span> PLAYER</span></div><div class="sub">شاهد بثوث Kick داخل صفحة واحدة</div></header><section class="panel"><form class="form" id="form"><input id="channel" type="url" placeholder="ضع رابط القناة مثل https://kick.com/x" autocomplete="url" required><button type="submit">تشغيل البث</button></form><div class="status" id="status" aria-live="polite"></div><div class="screen" id="screen"><div class="placeholder"><strong>🎥 جاهز للتشغيل</strong>أدخل رابط قناة Kick بالأعلى لعرض المشغل الرسمي هنا</div></div><p class="note">يستخدم الموقع مشغل Kick الرسمي. يجب أن يكون البث متاحًا لحسابك؛ لا يتجاوز الموقع الاشتراكات أو قيود الوصول أو تسجيل الدخول الخاصة بـ Kick.</p></section></main>
<script>
const form=document.getElementById('form'),input=document.getElementById('channel'),screen=document.getElementById('screen'),status=document.getElementById('status');
form.addEventListener('submit',e=>{e.preventDefault();let value=input.value.trim();let username='';try{const u=new URL(value);if(!['kick.com','www.kick.com'].includes(u.hostname.toLowerCase()))throw 0;username=u.pathname.split('/').filter(Boolean)[0]||'';if(!/^[a-zA-Z0-9_]+$/.test(username))throw 0;}catch{status.textContent='تأكد من إدخال رابط قناة صحيح مثل https://kick.com/username';return;}status.textContent='تم تحميل مشغل القناة: '+username;const iframe=document.createElement('iframe');iframe.src='https://player.kick.com/'+encodeURIComponent(username)+'?autoplay=false&muted=false';iframe.allow='autoplay; fullscreen; picture-in-picture';iframe.allowFullscreen=true;iframe.title='Kick live player';screen.replaceChildren(iframe);});
</script></body></html>
